<!-- ==================================================

================================================== -->

<script>

    const luna =
        document.getElementById(
            "lunaBtn"
        );

    const efectos =
        document.getElementById(
            "efectosLuna"
        );


    let animando = false;



    /* ==================================================
       CLICK EN LA LUNA
    ================================================== */

    luna.addEventListener(
        "click",
        function () {

            if (animando) {
                return;
            }


            animando = true;


            const rect =
                luna.getBoundingClientRect();


            const centroX =
                rect.left +
                rect.width / 2;


            const centroY =
                rect.top +
                rect.height / 2;


            /* ==========================================
               CONCENTRACIÓN ORIGINAL
            ========================================== */

            luna.classList.add(
                "luna-activa"
            );


            crearEspiral(
                centroX,
                centroY
            );


            /* ==================================================
               DESPUÉS DE LA ESPIRAL

               90% = EFECTO NORMAL
               10% = EASTER EGG DEL GATO
            ================================================== */

            setTimeout(
                function () {

                    crearDestello(
                        centroX,
                        centroY
                    );


                    const easterEgg =
                        Math.random() < 0.10;


                    if (easterEgg) {

                        crearEasterEggGato(
                            centroX,
                            centroY
                        );

                    } else {

                        crearExplosion(
                            centroX,
                            centroY
                        );

                    }

                },
                900
            );


            /* ==================================================
               LIBERAR LA LUNA

               Esperamos 5 segundos para que el easter egg
               pueda terminar antes de otro clic.
            ================================================== */

            setTimeout(
                function () {

                    luna.classList.remove(
                        "luna-activa"
                    );

                    animando = false;

                },
                1000
            );

        }
    );



    /* ==================================================
       EASTER EGG DEL GATO
    ================================================== */

    function crearEasterEggGato(
        cx,
        cy
    ) {

        /* ==========================================
           CORAZÓN GIGANTE
        ========================================== */

        const corazonGrande =
            document.createElement(
                "div"
            );


        corazonGrande.className =
            "easter-corazon-grande";


        corazonGrande.style.left =
            cx + "px";


        corazonGrande.style.top =
            cy + "px";


        efectos.appendChild(
            corazonGrande
        );



        /* ==========================================
           DESPUÉS APARECE LA PATA DESDE ARRIBA
        ========================================== */

        setTimeout(
            function () {

                const pata =
                    document.createElement(
                        "div"
                    );


                pata.className =
                    "easter-pata-gato";


                pata.style.left =
                    cx + "px";


                pata.style.top =
                    cy + "px";


                /*
                   Los dedos y la almohadilla
                   se dibujan con el CSS.
                */

                pata.innerHTML = `

                    <span class="easter-dedo d1"></span>

                    <span class="easter-dedo d2"></span>

                    <span class="easter-dedo d3"></span>

                    <span class="easter-dedo d4"></span>

                    <span class="easter-almohadilla"></span>

                `;


                efectos.appendChild(
                    pata
                );



                /* ==========================================
                   LA PATA GOLPEA EL CORAZÓN
                ========================================== */

                setTimeout(
                    function () {

                        corazonGrande.classList.add(
                            "easter-golpeado"
                        );

                    },
                    650
                );



                /* ==========================================
                   CORAZÓN REVIENTA
                ========================================== */

                setTimeout(
                    function () {

                        corazonGrande.classList.remove(
                            "easter-golpeado"
                        );


                        corazonGrande.classList.add(
                            "easter-reventar"
                        );


                        explosionCorazonesEasterEgg(
                            cx,
                            cy
                        );

                    },
                    850
                );



                /* ==========================================
                   PATA REGRESA HACIA ARRIBA
                ========================================== */

                setTimeout(
                    function () {

                        pata.classList.add(
                            "easter-pata-salir"
                        );

                    },
                    1100
                );



                /* ==========================================
                   LIMPIAR CORAZÓN Y PATA
                ========================================== */

                setTimeout(
                    function () {

                        pata.remove();

                        corazonGrande.remove();

                    },
                    1900
                );

            },
            900
        );

    }



    /* ==================================================
       EXPLOSIÓN DE MINI CORAZONES DEL EASTER EGG
    ================================================== */

    function explosionCorazonesEasterEgg(
        cx,
        cy
    ) {

        const cantidad =
            60;


        for (
            let i = 0;
            i < cantidad;
            i++
        ) {

            const corazon =
                document.createElement(
                    "div"
                );


            corazon.className =
                "easter-mini-corazon";


            corazon.style.left =
                cx + "px";


            corazon.style.top =
                cy + "px";



            /* ==========================================
               DIRECCIÓN ALEATORIA
            ========================================== */

            const angulo =
                Math.random() *
                Math.PI *
                2;


            const distancia =
                90 +
                Math.random() *
                260;


            const x =
                Math.cos(
                    angulo
                ) *
                distancia;


            const y =
                Math.sin(
                    angulo
                ) *
                distancia;



            /* ==========================================
               POSICIÓN FINAL CON CAÍDA
            ========================================== */

            const xFinal =
                x * 1.2;


            const yFinal =
                y * .45 +
                420 +
                Math.random() *
                160;


            const rotacion =
                -500 +
                Math.random() *
                1000;


            const escala =
                .55 +
                Math.random() *
                .8;



            corazon.style.setProperty(
                "--easter-x",
                x + "px"
            );


            corazon.style.setProperty(
                "--easter-y",
                y + "px"
            );


            corazon.style.setProperty(
                "--easter-x-final",
                xFinal + "px"
            );


            corazon.style.setProperty(
                "--easter-y-final",
                yFinal + "px"
            );


            corazon.style.setProperty(
                "--easter-rotacion",
                rotacion + "deg"
            );


            corazon.style.setProperty(
                "--easter-escala",
                escala
            );


            corazon.style.animationDelay =
                (
                    Math.random() *
                    .12
                ) + "s";


            efectos.appendChild(
                corazon
            );


            setTimeout(
                function () {

                    corazon.remove();

                },
                6000
            );

        }

    }



    /* ==================================================
       ESPIRAL DE CONCENTRACIÓN ORIGINAL
    ================================================== */

    function crearEspiral(
        cx,
        cy
    ) {

        const cantidad =
            32;


        for (
            let i = 0;
            i < cantidad;
            i++
        ) {

            const punto =
                document.createElement(
                    "span"
                );


            punto.className =
                "energia-espiral";


            const angulo =
                (
                    Math.PI *
                    2 /
                    cantidad
                ) * i;


            const radio =
                85 +
                Math.random() *
                55;


            const inicioX =
                Math.cos(
                    angulo
                ) *
                radio;


            const inicioY =
                Math.sin(
                    angulo
                ) *
                radio;



            /*
               Punto intermedio perpendicular.
               Esto conserva tu trayectoria
               en forma de espiral.
            */

            const medioX =
                -Math.sin(
                    angulo
                ) *
                radio *
                .48;


            const medioY =
                Math.cos(
                    angulo
                ) *
                radio *
                .48;


            punto.style.left =
                cx + "px";


            punto.style.top =
                cy + "px";


            punto.style.setProperty(
                "--inicio-x",
                inicioX + "px"
            );


            punto.style.setProperty(
                "--inicio-y",
                inicioY + "px"
            );


            punto.style.setProperty(
                "--medio-x",
                medioX + "px"
            );


            punto.style.setProperty(
                "--medio-y",
                medioY + "px"
            );


            punto.style.animationDelay =
                (
                    Math.random() *
                    .16
                ) + "s";


            efectos.appendChild(
                punto
            );


            setTimeout(
                function () {

                    punto.remove();

                },
                1400
            );

        }

    }



    /* ==================================================
       DESTELLO ORIGINAL
    ================================================== */

    function crearDestello(
        cx,
        cy
    ) {

        const destello =
            document.createElement(
                "div"
            );


        destello.className =
            "destello-luna";


        destello.style.left =
            cx + "px";


        destello.style.top =
            cy + "px";


        efectos.appendChild(
            destello
        );


        setTimeout(
            function () {

                destello.remove();

            },
            750
        );

    }


    /* ==================================================
       EXPLOSIÓN NORMAL ORIGINAL
    ================================================== */

    function crearExplosion(
        cx,
        cy
    ) {

        /*
            80 partículas

            65% corazones = 52
            25% blancas   = 20
            10% celestes  = 8
        */


        const tipos = [];


        /* 52 CORAZONES */

        for (
            let i = 0;
            i < 52;
            i++
        ) {

            tipos.push(
                "corazon"
            );

        }


        /* 20 FLORES BLANCAS */

        for (
            let i = 0;
            i < 20;
            i++
        ) {

            tipos.push(
                "blanca"
            );

        }


        /* 8 FLORES CELESTES */

        for (
            let i = 0;
            i < 8;
            i++
        ) {

            tipos.push(
                "celeste"
            );

        }



        /* ==================================================
           MEZCLAR LAS PARTÍCULAS
        ================================================== */

        tipos.sort(
            function () {

                return (
                    Math.random() -
                    .5
                );

            }
        );



        /* ==================================================
           CREAR EXPLOSIÓN
        ================================================== */

        tipos.forEach(
            function (
                tipo
            ) {

                const particula =
                    crearParticula(
                        tipo
                    );


                particula.style.left =
                    cx + "px";


                particula.style.top =
                    cy + "px";


                const angulo =
                    Math.random() *
                    Math.PI *
                    2;


                const distancia =
                    120 +
                    Math.random() *
                    270;


                const dx =
                    Math.cos(
                        angulo
                    ) *
                    distancia;


                const dy =
                    Math.sin(
                        angulo
                    ) *
                    distancia;



                /*
                    Después de explotar,
                    la gravedad hace que
                    comiencen a caer.
                */

                const dxFinal =
                    dx *
                    1.2;


                const dyFinal =
                    dy *
                    .45 +
                    430 +
                    Math.random() *
                    190;


                const rotacion =
                    -420 +
                    Math.random() *
                    840;


                const escala =
                    .7 +
                    Math.random() *
                    .75;



                particula.style.setProperty(
                    "--dx",
                    dx + "px"
                );


                particula.style.setProperty(
                    "--dy",
                    dy + "px"
                );


                particula.style.setProperty(
                    "--dx-final",
                    dxFinal + "px"
                );


                particula.style.setProperty(
                    "--dy-final",
                    dyFinal + "px"
                );


                particula.style.setProperty(
                    "--rotacion",
                    rotacion + "deg"
                );


                particula.style.setProperty(
                    "--escala",
                    escala
                );


                particula.style.animationDelay =
                    (
                        Math.random() *
                        .15
                    ) + "s";


                particula.style.animationDuration =
                    (
                        4.7 +
                        Math.random() *
                        1.8
                    ) + "s";


                efectos.appendChild(
                    particula
                );


                setTimeout(
                    function () {

                        particula.remove();

                    },
                    7000
                );

            }
        );

    }



    /* ==================================================
       CREAR CADA PARTÍCULA
    ================================================== */

    function crearParticula(
        tipo
    ) {

        const elemento =
            document.createElement(
                "div"
            );


        elemento.classList.add(
            "particula-explosion"
        );



        /* ==================================================
           CORAZÓN
        ================================================== */

        if (
            tipo ===
            "corazon"
        ) {

            elemento.classList.add(
                "fx-corazon"
            );


            return elemento;

        }



        /* ==================================================
           FLORES
        ================================================== */

        elemento.classList.add(
            "fx-flor"
        );


        /* FLOR BLANCA */

        if (
            tipo ===
            "blanca"
        ) {

            elemento.classList.add(
                "fx-flor-blanca"
            );

        }


        /* FLOR CELESTE */

        if (
            tipo ===
            "celeste"
        ) {

            elemento.classList.add(
                "fx-flor-celeste"
            );

        }



        /* ==================================================
           PÉTALOS DE LA FLOR
        ================================================== */

        elemento.innerHTML = `

            <span class="fx-petalo fx-p1"></span>

            <span class="fx-petalo fx-p2"></span>

            <span class="fx-petalo fx-p3"></span>

            <span class="fx-petalo fx-p4"></span>

            <span class="fx-petalo fx-p5"></span>

            <span class="fx-centro"></span>

        `;


        return elemento;

    }
