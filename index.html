<!-- ==================================================

<script>

    const luna =
        document.getElementById("lunaBtn");

    const efectos =
        document.getElementById("efectosLuna");


    let animando = false;



    /* ==================================================
       CLICK EN LA LUNA
    ================================================== */

    luna.addEventListener(
        "click",
        function () {

            if (animando) {
                return;
            }


            animando = true;


            const rect =
                luna.getBoundingClientRect();


            const centroX =
                rect.left +
                rect.width / 2;


            const centroY =
                rect.top +
                rect.height / 2;


            /* concentración */

            luna.classList.add(
                "luna-activa"
            );


            crearEspiral(
                centroX,
                centroY
            );


            /* explosión */

            setTimeout(
                function () {

                    crearDestello(
                        centroX,
                        centroY
                    );


                    crearExplosion(
                        centroX,
                        centroY
                    );

                },
                900
            );


            /* liberar nuevamente */

            setTimeout(
                function () {

                    luna.classList.remove(
                        "luna-activa"
                    );

                    animando = false;

                },
                2600
            );

        }
    );



    /* ==================================================
       ESPIRAL DE CONCENTRACIÓN
    ================================================== */

    function crearEspiral(
        cx,
        cy
    ) {

        const cantidad = 32;


        for (
            let i = 0;
            i < cantidad;
            i++
        ) {

            const punto =
                document.createElement(
                    "span"
                );


            punto.className =
                "energia-espiral";


            const angulo =
                (
                    Math.PI *
                    2 /
                    cantidad
                ) * i;


            const radio =
                85 +
                Math.random() *
                55;


            const inicioX =
                Math.cos(angulo) *
                radio;


            const inicioY =
                Math.sin(angulo) *
                radio;


            /*
                punto intermedio perpendicular

                Esto crea una trayectoria
                más parecida a una espiral.
            */

            const medioX =
                -Math.sin(angulo) *
                radio *
                .48;


            const medioY =
                Math.cos(angulo) *
                radio *
                .48;


            punto.style.left =
                cx + "px";


            punto.style.top =
                cy + "px";


            punto.style.setProperty(
                "--inicio-x",
                inicioX + "px"
            );


            punto.style.setProperty(
                "--inicio-y",
                inicioY + "px"
            );


            punto.style.setProperty(
                "--medio-x",
                medioX + "px"
            );


            punto.style.setProperty(
                "--medio-y",
                medioY + "px"
            );


            punto.style.animationDelay =
                (
                    Math.random() *
                    .16
                ) + "s";


            efectos.appendChild(
                punto
            );


            setTimeout(
                function () {

                    punto.remove();

                },
                1400
            );

        }

    }



    /* ==================================================
       DESTELLO
    ================================================== */

    function crearDestello(
        cx,
        cy
    ) {

        const destello =
            document.createElement(
                "div"
            );


        destello.className =
            "destello-luna";


        destello.style.left =
            cx + "px";


        destello.style.top =
            cy + "px";


        efectos.appendChild(
            destello
        );


        setTimeout(
            function () {

                destello.remove();

            },
            750
        );

    }



    /* ==================================================
       EXPLOSIÓN
    ================================================== */

    function crearExplosion(
        cx,
        cy
    ) {

        /*
            80 partículas

            65% corazones = 52
            25% blancas   = 20
            10% celestes  = 8
        */


        const tipos = [];


        for (
            let i = 0;
            i < 52;
            i++
        ) {

            tipos.push(
                "corazon"
            );

        }


        for (
            let i = 0;
            i < 20;
            i++
        ) {

            tipos.push(
                "blanca"
            );

        }


        for (
            let i = 0;
            i < 8;
            i++
        ) {

            tipos.push(
                "celeste"
            );

        }



        /* mezclar */

        tipos.sort(
            function () {

                return (
                    Math.random() -
                    .5
                );

            }
        );



        tipos.forEach(
            function (
                tipo
            ) {

                const particula =
                    crearParticula(
                        tipo
                    );


                particula.style.left =
                    cx + "px";


                particula.style.top =
                    cy + "px";


                const angulo =
                    Math.random() *
                    Math.PI *
                    2;


                const distancia =
                    120 +
                    Math.random() *
                    270;


                const dx =
                    Math.cos(
                        angulo
                    ) *
                    distancia;


                const dy =
                    Math.sin(
                        angulo
                    ) *
                    distancia;


                /*
                    Después de explotar,
                    la gravedad hace
                    que comiencen a caer.
                */

                const dxFinal =
                    dx *
                    1.2;


                const dyFinal =
                    dy *
                    .45 +
                    430 +
                    Math.random() *
                    190;


                const rotacion =
                    -420 +
                    Math.random() *
                    840;


                const escala =
                    .7 +
                    Math.random() *
                    .75;


                particula.style.setProperty(
                    "--dx",
                    dx + "px"
                );


                particula.style.setProperty(
                    "--dy",
                    dy + "px"
                );


                particula.style.setProperty(
                    "--dx-final",
                    dxFinal + "px"
                );


                particula.style.setProperty(
                    "--dy-final",
                    dyFinal + "px"
                );


                particula.style.setProperty(
                    "--rotacion",
                    rotacion + "deg"
                );


                particula.style.setProperty(
                    "--escala",
                    escala
                );


                particula.style.animationDelay =
                    (
                        Math.random() *
                        .15
                    ) + "s";


                particula.style.animationDuration =
                    (
                        4.7 +
                        Math.random() *
                        1.8
                    ) + "s";


                efectos.appendChild(
                    particula
                );


                setTimeout(
                    function () {

                        particula.remove();

                    },
                    7000
                );

            }
        );

    }



    /* ==================================================
       CREAR PARTÍCULA
    ================================================== */

    function crearParticula(
        tipo
    ) {

        const elemento =
            document.createElement(
                "div"
            );


        elemento.classList.add(
            "particula-explosion"
        );



        /* ==================================================
           CORAZÓN
        ================================================== */

        if (
            tipo ===
            "corazon"
        ) {

            elemento.classList.add(
                "fx-corazon"
            );


            return elemento;

        }



        /* ==================================================
           FLORES
        ================================================== */

        elemento.classList.add(
            "fx-flor"
        );


        if (
            tipo ===
            "blanca"
        ) {

            elemento.classList.add(
                "fx-flor-blanca"
            );

        }


        if (
            tipo ===
            "celeste"
        ) {

            elemento.classList.add(
                "fx-flor-celeste"
            );

        }


        elemento.innerHTML = `

            <span class="fx-petalo fx-p1"></span>

            <span class="fx-petalo fx-p2"></span>

            <span class="fx-petalo fx-p3"></span>

            <span class="fx-petalo fx-p4"></span>

            <span class="fx-petalo fx-p5"></span>

            <span class="fx-centro"></span>

        `;


        return elemento;

    }

</script>
